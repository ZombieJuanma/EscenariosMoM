description.Spanish=Un imprevisto ha provocado que vuestro barco haya parado en el pueblo de Innsmouth y tenéis que pedir ayuda.\n\nPrimer escenario que creo en Valkyrie. Espero que os guste.\nNo se requieren expansiones.
description.Korean=\n당신이 타고 있던 배가 예상치 못한 사고로 ‘인스머스’에 멈춰 섰습니다. 도움을 요청해야합니다.\n\n본 시나리오는 제작자의 첫 시나리오입니다. 당신이 좋아하길 바랍니다.\n\n※본 시나리오는 확장이 필요하지 않습니다.\n
description.French=Un imprévu a forcé votre bateau à s'arrêter dans le village d'Innsmouth et vous devez demander de l'aide.\n\nPremier scénario que je crée dans Valkyrie. J'espère qu'il vous plaira.\nAucune extension requise.
