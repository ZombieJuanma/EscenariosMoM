name.Spanish=Desaparición en el bosque
name.Portuguese=Desaparecimento na floresta
name.Polish=Zaginieni w lesie
name.French=Disparition dans la forêt
synopsys.Spanish=Una joven y su novio han desaparecido por un bosque y debéis iniciar la búsqueda.
synopsys.Portuguese=Uma jovem e seu namorado desapareceram em uma floresta e você deve começar sua busca.
synopsys.Polish=Młoda kobieta i jej chłopak zaginęli w lesie, a wy musicie rozpocząć poszukiwania.
synopsys.French=Une jeune femme et son petit ami ont disparu dans une forêt et vous devez lancer les recherches.
description.Spanish=Linda Heath y su novio Daniel Taylor han pasado el fin de semana en una casa rural situada en un bosque. Cuando los padres de Linda llegan a la casa descubren que han desaparecido.\n\nSe necesita la expansión Recuerdos Reprimidos o La Llamada de lo Salvaje para poder jugar.
description.Portuguese=Linda Heath e seu namorado Daniel Taylor passaram o fim de semana em uma casa rural localizada em uma floresta. Quando os pais de Linda chegam em casa, descobrem que desapareceram.\n\nMemórias reprimidas ou expansão Call of the Wild necessária para jogar.
description.Polish=Linda Heath i jej chłopak, Daniel Taylor spędzali weekend w domku w lesie. Kiedy rodzice Lindy przybywają na miejsce odkrywają, że nikogo tam już nie ma.\n\nScenariusz wymaga dodatku "Suppressed Memories" lub "Zew Dziczy".
description.French=Linda Heath et son petit ami Daniel Taylor ont passé le week-end dans une maison rurale située dans une forêt. Lorsque les parents de Linda arrivent, ils découvrent qu'ils ont disparu.\n\nL'extension "Souvenirs Reprimés" ou "L'Appel de la Forêt" est nécessaire pour jouer.
